<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>マスタ | ポーカーフェイト成績表</title>
    <link rel="icon" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260907183008">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>

<body>
    <header class="site-head">
        <h1 class="site-title">ポーカーフェイト成績表</h1>
        <nav class="site-nav">
            <a href="index.html">成績表</a>
            <a href="matches.html">試合一覧</a>
            <a href="master.html" class="is-current">マスタ</a>
            <a href="input.html" class="btn-primary">結果を入力する</a>
        </nav>
    </header>

    <main class="wrap">
        <section class="gate" id="gate" hidden>
            <h2>マスタの編集にはパスワードが必要です</h2>
            <form id="login-form" class="gate-form">
                <input type="password" id="password" placeholder="パスワード" autocomplete="current-password">
                <button type="submit" class="btn-primary">開く</button>
            </form>
            <p class="error" id="login-error" hidden>パスワードが違います</p>
        </section>

        <div id="app" hidden>
            <div class="tabs" id="tabs">
                <button type="button" class="tab is-current" data-tab="players">プレイヤー</button>
                <button type="button" class="tab" data-tab="periods">集計期間</button>
            </div>

            <section class="panel" id="pane-players">
                <form class="inline-form" id="player-form">
                    <input type="hidden" id="player-id">
                    <input type="text" id="player-name" placeholder="登録名" required>
                    <input type="text" id="player-youtube" placeholder="YouTube名（任意）">
                    <input type="text" id="player-note" placeholder="備考（任意）">
                    <button type="submit" class="btn-primary">保存</button>
                    <button type="button" class="btn-ghost" data-cancel="player">クリア</button>
                </form>
                <div class="table-scroll" id="players"></div>
            </section>

            <section class="panel" id="pane-periods" hidden>
                <form class="inline-form" id="period-form">
                    <input type="hidden" id="period-id">
                    <input type="text" id="period-name" placeholder="期名" required>
                    <input type="date" id="period-from" required>
                    <input type="date" id="period-to" required>
                    <button type="submit" class="btn-primary">保存</button>
                    <button type="button" class="btn-ghost" id="period-month">今月を入れる</button>
                    <button type="button" class="btn-ghost" data-cancel="period">クリア</button>
                </form>
                <div class="table-scroll" id="periods"></div>
                <p class="note">集計期間は1ヶ月ごと。「今月を入れる」で当月の初日〜末日が入ります。</p>
            </section>

        </div>
    </main>

    <script src="js/core.js?v=20260907183008"></script>
    <script src="js/master.js?v=20260907183008"></script>
</body>

</html>
