<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>結果を入力する | ポカチェ 成績表</title>
    <link rel="icon" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=202609071813">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>

<body>
    <header class="site-head">
        <h1 class="site-title">ポカチェ 成績表</h1>
        <nav class="site-nav">
            <a href="index.html">成績表</a>
            <a href="matches.html">試合一覧</a>
            <a href="master.html">マスタ</a>
            <a href="input.html" class="is-current">結果を入力する</a>
        </nav>
    </header>

    <main class="wrap">
        <section class="gate" id="gate" hidden>
            <h2>入力にはパスワードが必要です</h2>
            <form id="login-form" class="gate-form">
                <input type="password" id="password" placeholder="パスワード" autocomplete="current-password">
                <button type="submit" class="btn-primary">開く</button>
            </form>
            <p class="error" id="login-error" hidden>パスワードが違います</p>
        </section>

        <div id="app" hidden>
            <section class="panel">
                <h2 class="panel-title">試合結果を入力</h2>
                <form id="match-form" class="match-form">
                    <div class="row">
                        <label class="field field-sm">
                            <span class="field-label">日付</span>
                            <input type="date" id="date" required>
                        </label>
                        <label class="field field-sm">
                            <span class="field-label">コード</span>
                            <input type="text" id="code" placeholder="B01" list="codes">
                            <datalist id="codes"></datalist>
                        </label>
                    </div>

                    <div class="seats" id="seats"></div>
                    <datalist id="player-list"></datalist>

                    <p class="error" id="form-error" hidden></p>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary" id="submit-btn">この結果を登録する</button>
                        <button type="button" class="btn-ghost" id="reset-btn">クリア</button>
                        <span class="saved" id="saved" hidden>登録しました</span>
                    </div>
                </form>
            </section>

            <section class="panel">
                <h2 class="panel-title">直近の入力</h2>
                <div class="table-scroll" id="recent"></div>
            </section>
        </div>
    </main>

    <script src="js/core.js?v=202609071813"></script>
    <script src="js/input.js?v=202609071813"></script>
</body>

</html>
